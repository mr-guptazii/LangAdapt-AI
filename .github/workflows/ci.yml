name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector-enabled image: unlike a native install without the extension
        # (see DATABASE.md's pgvector note), CI can run the FULL migration
        # chain including the semantic_memory migration.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lingoadapt
          POSTGRES_PASSWORD: lingoadapt
          POSTGRES_DB: lingoadapt
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lingoadapt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: apps/api

    env:
      DATABASE_URL: postgresql+asyncpg://lingoadapt:lingoadapt@localhost:5432/lingoadapt
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-test-secret
      LLM_PROVIDER: mock
      STT_PROVIDER: mock
      TTS_PROVIDER: mock
      EMBEDDING_PROVIDER: mock

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint (ruff, including security rules)
        run: ruff check app/ scripts/ tests/
      - name: Dependency vulnerability scan (pip-audit)
        run: pip install pip-audit && pip-audit -r requirements.txt --skip-editable || echo "::warning::pip-audit found issues — review before release"
      - name: Run migrations (full chain, including pgvector)
        run: alembic upgrade head
      - name: Verify app + Celery app import cleanly
        run: |
          python -c "from app.main import app; assert len(app.openapi()['paths']) > 0"
          python -c "from app.tasks.celery_app import celery_app; from app.tasks import jobs; assert 'app.tasks.jobs.generate_recommendations_for_active_users' in celery_app.tasks"
      - name: Run tests with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: apps/api/coverage.xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci --no-fund --no-audit || npm install --no-fund --no-audit
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npx eslint .
      - name: Dependency vulnerability scan (npm audit)
        run: npm audit --audit-level=high || echo "::warning::npm audit found issues — review before release"
      - name: Unit tests
        run: npx vitest run
      - name: Build
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f infrastructure/docker/Dockerfile.api -t lingoadapt-api:ci .
      - name: Build worker image
        run: docker build -f infrastructure/docker/Dockerfile.worker -t lingoadapt-worker:ci .
      - name: Build web image
        run: docker build -f infrastructure/docker/Dockerfile.web -t lingoadapt-web:ci .
