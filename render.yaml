# Render Blueprint — provisions the API, background worker, Postgres
# (pgvector-enabled), and Redis in one shot. Deploy via Render's dashboard:
# "New" -> "Blueprint" -> select this repo. Fields marked `sync: false` are
# prompted for at creation time and never stored in git.
#
# The frontend (apps/web) is NOT included here — it's deployed separately on
# Vercel (native Next.js support, better fit than Render for that half). See
# docs/DEPLOYMENT.md for the full two-platform walkthrough.

databases:
  - name: lingoadapt-db
    plan: basic-256mb
    postgresMajorVersion: "17"

services:
  - name: lingoadapt-redis
    type: keyvalue
    plan: starter
    maxmemoryPolicy: allkeys-lru
    # Empty = no public internet access; lingoadapt-api/-worker still reach it
    # over Render's private network via the fromService reference below.
    ipAllowList: []

  - name: lingoadapt-api
    type: web
    runtime: docker
    plan: starter
    dockerfilePath: ./infrastructure/docker/Dockerfile.api
    dockerContext: .
    healthCheckPath: /health
    # No dockerCommand override needed: the image's own CMD (apps/api/entrypoint.sh)
    # runs migrations then starts uvicorn on $PORT if set, defaulting to 8000
    # otherwise — Render sets PORT automatically for web services. (A prior
    # version of this file tried to override the command inline with
    # `sh -c "...&&..."` directly in dockerCommand; Render did not shell-parse
    # that string the way a real shell would and it failed with "command not
    # found" on the whole literal string. Baking the logic into the image's
    # own entrypoint instead sidesteps that per-platform quoting ambiguity —
    # see entrypoint.sh's comment.)
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lingoadapt-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: lingoadapt-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENV
        value: production
      - key: DEBUG
        value: "false"
      # LLM provider: set these at creation time (Render prompts for every
      # `sync: false` var with no default — enter "mock" for a zero-setup
      # boot, or "anthropic"/"openai" for a real provider). LLM_PROVIDER=openai
      # routes through OpenAICompatibleProvider — works with real OpenAI,
      # NVIDIA NIM, or Gemini's OpenAI-compat endpoint depending on
      # OPENAI_BASE_URL (see .env.example for exact values per backend).
      - key: LLM_PROVIDER
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        sync: false
      - key: OPENAI_MODEL_FAST
        sync: false
      - key: OPENAI_MODEL_STRONG
        sync: false
      # CORS: enter '["http://localhost:3000"]' for now (JSON array syntax)
      # and update it to your real Vercel domain once that's deployed — it
      # isn't known yet on first deploy of this blueprint. See DEPLOYMENT.md
      # step 3.
      - key: CORS_ORIGINS
        sync: false
      # Voice + embeddings: previously omitted entirely from this blueprint,
      # meaning every deployed environment silently ran STT/TTS/pronunciation/
      # embeddings as mock regardless of what real provider code existed —
      # an operator had to know to add these manually outside the blueprint.
      # Leave blank for mock defaults; see .env.example for real values
      # (e.g. STT_PROVIDER=openai_whisper + STT_MODEL=whisper-large-v3-turbo
      # against the same Groq key/base URL as the LLM vars above).
      - key: STT_PROVIDER
        sync: false
      - key: STT_MODEL
        sync: false
      - key: TTS_PROVIDER
        sync: false
      - key: TTS_MODEL
        sync: false
      - key: EMBEDDING_PROVIDER
        sync: false

  - name: lingoadapt-worker
    type: worker
    runtime: docker
    plan: starter
    dockerfilePath: ./infrastructure/docker/Dockerfile.worker
    dockerContext: .
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lingoadapt-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: lingoadapt-redis
          property: connectionString
      - key: JWT_SECRET
        fromService:
          type: web
          name: lingoadapt-api
          envVarKey: JWT_SECRET
      - key: ENV
        value: production
      - key: LLM_PROVIDER
        fromService:
          type: web
          name: lingoadapt-api
          envVarKey: LLM_PROVIDER
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        sync: false
      - key: OPENAI_MODEL_FAST
        sync: false
      - key: OPENAI_MODEL_STRONG
        sync: false
